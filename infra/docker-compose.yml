name: leadflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadflow}
      POSTGRES_DB: leadflow
    # Bound to localhost only: the database is never exposed to the network.
    # Host port 5433 because 5432 is often taken by a locally installed PostgreSQL.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow -d leadflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
